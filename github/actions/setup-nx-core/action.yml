name: setup-nx-core
description: Shared Nx CI setup (disk reclaim, branch detection, node_modules + Nx cache, install) consumed by each repo's thin setup-nx wrapper.

# Shared Nx CI setup, consumed by each repo's thin `.github/actions/setup-nx` wrapper.
# The wrapper supplies the repo-specific layout literals (cache paths + precomputed
# hashFiles values + the node_modules clean globs); everything behavioural lives here
# so a fix is written once and percolates to every repo via the ag-shared subrepo.

inputs:
    yarn_postinstall:
        description: 'Always ensure yarn postinstall is run.'
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'
            - 'no-install'
    skip_plugin_build:
        description: >-
            Skip the repo postinstall plugin-build pass on an exact node_modules cache hit.
            Only safe for jobs whose own nx run materialises all outputs it needs (plugin-build
            side-effect-builds plugin dependencies such as package dist/types).
        required: false
        default: 'false'
        options:
            - 'true'
            - 'false'
    fetch_base:
        description: 'Shallow fetch latest branch.'
        required: false
        default: 'shallow'
        options:
            - 'shallow'
            - 'full'
            - 'skip'
    nx_restore:
        description: 'Restore Nx Cache.'
        required: false
        default: 'true'
    base_ref:
        description: 'Base branch/SHA for diff detection'
        default: 'latest'
        required: false
    cache_mode:
        description: 'Read/write mode for caches'
        required: false
        default: 'rw'
        options:
            - 'rw'
            - 'ro'
            - 'off'
    free_disk_space:
        description: 'Delete large preinstalled toolchains to reclaim root-partition space (avoids runner ENOSPC). Set false on jobs that do not exhaust disk to skip the slow delete.'
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'
    tidy_nx_cache:
        description: 'Reset the Nx cache before a build when it exceeds a branch-type size threshold. Set false to skip the tidy step (e.g. ag-studio, which historically did not tidy).'
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'
    tidy_nx_cache_pr_threshold_mb:
        description: 'On-disk size in MB above which a PR run resets the Nx cache. Sizes are uncompressed, so this does not equal the stored cache entry size.'
        required: false
        default: '700'
    save_yarn_cache:
        description: 'Save the yarn download cache after an install that warmed it. Set false to restore only, e.g. on PRs, so they do not spend the shared cache quota.'
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'
    node_modules_paths:
        description: 'Newline-delimited cache paths for the node_modules cache (repo layout specific). Also reused as the wipe list on an inexact cache restore. Supplied by the wrapper.'
        required: true
    node_modules_hash:
        description: 'Precomputed hashFiles() value keying the node_modules cache. Computed by the wrapper because hashFiles() needs literal glob arguments.'
        required: true
    nx_cache_hash:
        description: 'Precomputed hashFiles() value keying the Nx cache. Computed by the wrapper because hashFiles() needs literal glob arguments.'
        required: true
    nx_cache_scheme:
        description: >-
            How the Nx cache is shared. legacy: one per-commit cache, saved at the end of rw jobs.
            merged: restore the base branch cache merged with this PR or branch cache; jobs save
            nothing themselves, but upload parts (nx-cache-part) that one job merges and saves
            (nx-cache-save).
        required: false
        default: 'legacy'
        options:
            - 'legacy'
            - 'merged'
    nx_cache_merge_base:
        description: >-
            merged only: merge the base branch cache into a PR or branch cache. Set false on the job
            that runs nx-cache-save, so a PR saves only its own entries; parts already leave base
            entries out.
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'

outputs:
    base:
        description: 'Base branch/SHA for diff detection'
        value: ${{ steps.nx_config.outputs.base }}
    type:
        description: 'Type of job execution detected'
        value: ${{ steps.nx_config.outputs.type }}

runs:
    using: 'composite'
    steps:
        - name: Free disk space
          if: runner.os == 'Linux' && inputs.free_disk_space == 'true'
          shell: bash
          run: |
              # Log starting headroom (before the delete) and the amount reclaimed.
              df -h /
              # Best-effort reclaim of root-partition space to avoid runner ENOSPC by
              # deleting large preinstalled toolchains this repo never uses. Deleted in a
              # single rm: parallelising the unlinks showed no reliable speedup on CI
              # runners (delete time is dominated by runner disk I/O, not by serialisation).
              # ($AGENT_TOOLSDIRECTORY == /opt/hostedtoolcache, so it is not listed twice.)
              sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/share/boost
              df -h /

        - name: Dump GitHub context
          env:
              GITHUB_CONTEXT: ${{ toJson(github) }}
          if: ${{ env.ACTIONS_STEP_DEBUG == 'true' }}
          shell: bash
          run: echo "$GITHUB_CONTEXT"

        - name: Set Nx parallelization
          shell: bash
          run: |
              if [ -z "${NX_PARALLEL}" ]; then
                # Get CPU count in a cross-platform way
                if command -v nproc >/dev/null 2>&1; then
                  CPUS=$(nproc)
                else
                  # macOS fallback
                  CPUS=$(sysctl -n hw.logicalcpu)
                fi
                echo "NX_PARALLEL=${CPUS}" >> $GITHUB_ENV
                echo "Setting NX_PARALLEL to ${CPUS}"
              else
                echo "NX_PARALLEL already set to ${NX_PARALLEL}, skipping"
              fi

        - name: Nx Affected SHA Setup
          id: nx_config
          shell: bash
          run: |
              set -x

              fetch_success_tag() {
                local tag=$1
                if git show-ref --verify --quiet "refs/tags/${tag}" ; then
                  echo "Using already-fetched ${tag} tag"
                  return 0
                fi

                git fetch origin -f --depth 1 tag "${tag}"
              }

              branch=$(git branch --show-current)
              if [[ ${branch} == 'latest' || ${branch} == 'next' ]] ; then
                # Latest
                echo "base=${branch}-success" >> $GITHUB_OUTPUT
                echo "NX_BASE=${branch}-success" >> $GITHUB_ENV
                echo "type=latest" >> $GITHUB_OUTPUT
                fetch_success_tag "${branch}-success"
              elif [[ ${branch} =~ b[0-9][0-9]\..+ ]] ; then
                # Release
                # Try to use the -success tag if it exists, otherwise fall back to branch name
                if fetch_success_tag "${branch}-success" 2>/dev/null; then
                  echo "base=${branch}-success" >> $GITHUB_OUTPUT
                  echo "NX_BASE=${branch}-success" >> $GITHUB_ENV
                else
                  echo "base=${branch}" >> $GITHUB_OUTPUT
                  echo "NX_BASE=${branch}" >> $GITHUB_ENV
                fi
                echo "type=release" >> $GITHUB_OUTPUT
                echo "release_branch=${branch}" >> $GITHUB_OUTPUT
              else
                # PR
                echo "base=origin/${{ inputs.base_ref }}" >> $GITHUB_OUTPUT
                echo "NX_BASE=origin/${{ inputs.base_ref }}" >> $GITHUB_ENV
                echo "type=pr" >> $GITHUB_OUTPUT
                if [[ ${{ inputs.fetch_base }} == 'shallow' ]] ; then
                  git fetch origin --depth 1 ${{ inputs.base_ref }}
                elif [[ ${{ inputs.fetch_base }} == 'full' ]] ; then
                  git fetch origin ${{ inputs.base_ref }}
                fi

                if [[ "${{inputs.base_ref}}" =~ b[0-9][0-9]\..+ ]] ; then
                  echo "release_branch=${{ inputs.base_ref }}" >> $GITHUB_OUTPUT
                fi
              fi

              cat $GITHUB_OUTPUT
              cat $GITHUB_ENV

        - name: Restore node_modules
          if: inputs.cache_mode == 'ro'
          id: cache_ro
          uses: actions/cache/restore@v6
          with:
              path: ${{ inputs.node_modules_paths }}
              key: node_modules-${{ runner.os }}-${{ steps.nx_config.outputs.release_branch && format('release-{0}-{1}', steps.nx_config.outputs.release_branch, inputs.node_modules_hash) || inputs.node_modules_hash }}
              restore-keys: ${{ steps.nx_config.outputs.release_branch && format('node_modules-{0}-release-{1}-', runner.os, steps.nx_config.outputs.release_branch) || format('node_modules-{0}-', runner.os) }}
              # For releases add release branch to key, otherwise take any latest cache if failed to find it for current yarn.lock
              # fail-on-cache-miss: true

        - name: Restore node_modules
          # Restore only; saved by the explicit "Save node_modules" step after yarn install.
          # actions/cache@v6's post-save hook cannot be used: expression contexts are lost
          # in post steps of nested composite actions (actions/runner#2009), so its `path`
          # resolves empty and the save is silently skipped.
          if: inputs.cache_mode == 'rw'
          id: cache_rw
          uses: actions/cache/restore@v6
          with:
              path: ${{ inputs.node_modules_paths }}
              key: node_modules-${{ runner.os }}-${{ steps.nx_config.outputs.release_branch && format('release-{0}-{1}', steps.nx_config.outputs.release_branch, inputs.node_modules_hash) || inputs.node_modules_hash }}
              restore-keys: ${{ steps.nx_config.outputs.release_branch && format('node_modules-{0}-release-{1}-', runner.os, steps.nx_config.outputs.release_branch) || format('node_modules-{0}-', runner.os) }}
              # For releases add release branch to key, otherwise take any latest cache if failed to find it for current yarn.lock

        - name: Cache Nx
          # Post-save works here only because `path` is a literal (see "Restore node_modules");
          # do not parameterise it via inputs.
          if: inputs.cache_mode == 'rw' && inputs.nx_restore != 'false' && inputs.nx_cache_scheme != 'merged'
          uses: actions/cache@v6
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: cache-nx-v20-${{ inputs.nx_cache_hash }}-${{ github.sha }}
              restore-keys: cache-nx-v20-${{ inputs.nx_cache_hash }}-

        - name: Restore Nx
          if: inputs.cache_mode == 'ro' && inputs.nx_restore != 'false' && inputs.nx_cache_scheme != 'merged'
          id: cache_nx_ro
          uses: actions/cache/restore@v6
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: cache-nx-v20-${{ inputs.nx_cache_hash }}-${{ github.sha }}
              restore-keys: cache-nx-v20-${{ inputs.nx_cache_hash }}-
              # fail-on-cache-miss: true

        - name: Nx cache scope
          # Base-branch runs save under `branch-<name>`; PRs and other branches under their own
          # scope. GitHub restores a PR's own caches before its base branch's, so distinct prefixes
          # keep a PR's caches from hiding newer base-branch ones, and naming the base branch keeps
          # a release-branch PR from restoring the default branch's cache. Other bases, such as
          # `next`, may have no push CI to save a cache, so they fall back to the default branch's.
          if: inputs.cache_mode != 'off' && inputs.nx_restore != 'false' && inputs.nx_cache_scheme == 'merged'
          id: nx_scope
          shell: bash
          env:
              BRANCH_TYPE: ${{ steps.nx_config.outputs.type }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              TARGET_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
              DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              NX_CACHE_HASH: ${{ inputs.nx_cache_hash }}
          run: |
              sanitise() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-' ; }
              if [[ ${BRANCH_TYPE} == 'latest' || ${BRANCH_TYPE} == 'release' ]] ; then
                base="branch-$(sanitise "${GITHUB_REF_NAME}")"
                scope="${base}"
              else
                base="branch-$(sanitise "${TARGET_BRANCH}")"
                if [[ ${TARGET_BRANCH} != "${DEFAULT_BRANCH}" && ! ${TARGET_BRANCH} =~ ^b[0-9]+\.[0-9]+\.[0-9]+$ ]] ; then
                  echo "fallback=cache-nx-v21-branch-$(sanitise "${DEFAULT_BRANCH}")" >> "$GITHUB_OUTPUT"
                fi
                if [[ -n ${PR_NUMBER} ]] ; then
                  scope="pr-${PR_NUMBER}"
                else
                  scope="ref-$(sanitise "${GITHUB_REF_NAME}")"
                fi
              fi
              {
                echo "scope=${scope}"
                echo "base=cache-nx-v21-${base}"
                echo "own=cache-nx-v21-${scope}"
                echo "separate=$([[ ${scope} == "${base}" ]] && echo false || echo true)"
              } >> "$GITHUB_OUTPUT"
              # GitHub caches are immutable, so each run, and each re-run of it, saves under its own
              # key; a later run on the same commit can then publish the entries it adds.
              echo "NX_CACHE_SAVE_KEY=cache-nx-v21-${scope}-${NX_CACHE_HASH}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

        - name: Restore base-branch Nx cache
          if: steps.nx_scope.outputs.scope && (steps.nx_scope.outputs.separate != 'true' || inputs.nx_cache_merge_base != 'false')
          uses: actions/cache/restore@v6
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: ${{ steps.nx_scope.outputs.base }}-${{ inputs.nx_cache_hash }}-${{ github.sha }}
              restore-keys: |
                  ${{ steps.nx_scope.outputs.base }}-${{ inputs.nx_cache_hash }}-${{ github.sha }}-
                  ${{ steps.nx_scope.outputs.base }}-${{ inputs.nx_cache_hash }}-
                  ${{ steps.nx_scope.outputs.base }}-
                  ${{ steps.nx_scope.outputs.fallback && format('{0}-{1}-', steps.nx_scope.outputs.fallback, inputs.nx_cache_hash) || '' }}
                  ${{ steps.nx_scope.outputs.fallback && format('{0}-', steps.nx_scope.outputs.fallback) || '' }}

        - name: Set aside base-branch Nx cache
          # Merged after install, so the tidy step below never resets it.
          if: steps.nx_scope.outputs.separate == 'true' && inputs.nx_cache_merge_base != 'false'
          shell: bash
          run: |
              mkdir -p "${RUNNER_TEMP}/nx-base"
              for dir in cache workspace-data ; do
                if [[ -d ".nx/${dir}" ]] ; then mv ".nx/${dir}" "${RUNNER_TEMP}/nx-base/${dir}" ; fi
              done

        - name: Restore own Nx cache
          if: steps.nx_scope.outputs.separate == 'true'
          uses: actions/cache/restore@v6
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: ${{ steps.nx_scope.outputs.own }}-${{ inputs.nx_cache_hash }}-${{ github.sha }}
              restore-keys: |
                  ${{ steps.nx_scope.outputs.own }}-${{ inputs.nx_cache_hash }}-${{ github.sha }}-
                  ${{ steps.nx_scope.outputs.own }}-${{ inputs.nx_cache_hash }}-
                  ${{ steps.nx_scope.outputs.own }}-

        - name: Setup Node.js
          id: setup_node
          uses: actions/setup-node@v7
          with:
              node-version-file: package.json

        - name: Enable corepack
          # GitHub-hosted runners ship corepack but not enabled, so a bare `yarn`
          # resolves to the runner image's preinstalled Yarn Classic, silently
          # ignoring this repo's "packageManager" pin (Yarn 4). Must run after
          # Setup Node.js (corepack is installed alongside Node) and before any
          # `yarn` invocation below.
          shell: bash
          run: corepack enable

        - name: Record restored Nx cache DBs
          # Before the postinstall runs nx, which may create this machine's DB alongside it.
          if: inputs.cache_mode != 'off' && inputs.nx_restore != 'false'
          shell: bash
          run: node "${{ github.action_path }}/nx-cache-db.mjs" snapshot "${RUNNER_TEMP}/nx-cache-state.json"

        - name: Tidy Nx Cache
          uses: ./external/ag-shared/github/actions/tidy-nx-cache
          if: inputs.cache_mode == 'rw' && inputs.nx_restore != 'false' && inputs.tidy_nx_cache != 'false'
          with:
              branch_type: ${{ steps.nx_config.outputs.type }}
              pr_threshold_mb: ${{ inputs.tidy_nx_cache_pr_threshold_mb }}

        - name: Resolve yarn cache dir
          # Ask yarn where its download cache lives rather than hard-coding the default
          # location, so a relocated cache folder (YARN_CACHE_FOLDER, or a .yarnrc.yml
          # cacheFolder) cannot silently point restore/save at the wrong (empty) path.
          # Gated to the cases where the yarn cache restore/save can run. Runners are
          # Linux-only, so no cross-OS path handling is needed.
          # Yarn 4 has no "yarn cache dir" command; `yarn config get cacheFolder`
          # is the equivalent (defaults to the shared global cache at
          # ~/.yarn/berry/cache since enableGlobalCache is on by default).
          if: inputs.cache_mode != 'off'
          id: yarn_cache_dir
          shell: bash
          run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

        - name: Restore yarn cache
          # Persist the yarn download cache so `yarn install` serves packages from here
          # instead of cold-downloading the dependency closure from the internal registry —
          # this is the core fix (node_modules was cached but this dir was not, leaving every
          # install a cold fetch). The cache is content-addressed by package version, so a
          # restore-keys fallback is safe: stale entries are inert and simply ignored.
          #
          # Restored whenever any install step below might run `yarn install --immutable` —
          # which, under Yarn 4's node-modules linker, is every one of them, including on an
          # exact node_modules cache hit. Measured directly: even with node_modules fully
          # populated and unchanged, `--immutable` still redoes a full Resolution -> Fetch ->
          # Link pass (observed: "2963 packages were added to the project (+ 1.58 GiB)",
          # ~30s) when this dir is empty, because Yarn 4 doesn't skip Fetch/Link just because
          # node_modules looks right - the previous exclusion here was written for a
          # lighter-weight "integrity check" assumption that doesn't hold for Yarn 4's
          # --immutable semantics. Confirmed causally: reproducing an empty cache dir locally
          # (node_modules and Yarn's own install-state.gz both left untouched) reproduces the
          # ~30-35s cost exactly; restoring this dir removes it.
          #
          # Still skipped for `yarn_postinstall: false` in ro mode: the only install step for
          # `false` is gated on rw, so an ro+false job never installs and a restore would be
          # wasted.
          #
          # The key carries runner.arch because saved caches are hollowed for the saving
          # runner's architecture (see "Hollow yarn cache"): a runner on another arch would
          # find its native packages present-but-empty and never re-download them.
          if: inputs.cache_mode != 'off' && (inputs.yarn_postinstall != 'false' || inputs.cache_mode == 'rw')
          id: yarn_cache
          uses: actions/cache/restore@v6
          with:
              path: ${{ steps.yarn_cache_dir.outputs.dir }}
              key: yarn-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node_modules_hash }}
              restore-keys: yarn-cache-${{ runner.os }}-${{ runner.arch }}-

        - name: yarn install
          if: inputs.yarn_postinstall == 'true'
          id: yarn_install_slow
          shell: bash
          env:
              # 'true' only on an exact key hit; an inexact restore-keys fallback can carry a stale hoisting layout.
              EXACT_CACHE_HIT: ${{ steps.cache_rw.outputs.cache-hit == 'true' || steps.cache_ro.outputs.cache-hit == 'true' }}
              NODE_MODULES_PATHS: ${{ inputs.node_modules_paths }}
              SKIP_PLUGIN_BUILD_ENV: ${{ inputs.skip_plugin_build == 'true' && 'AG_SKIP_PLUGIN_BUILD=1' || '' }}
          run: |
              if [[ "${EXACT_CACHE_HIT}" != "true" ]] ; then
                # Fallback restore: wipe node_modules so install rebuilds hoisting from this
                # lockfile, avoiding stale-layout cache poisoning. Reuse the newline-delimited
                # cache-path list: unquoted expansion word-splits and glob-expands it, and the
                # trailing slashes are harmless to rm -rf. Guarded so a future consumer passing
                # an empty value cannot turn this into a bare `rm -rf`.
                if [[ -n "${NODE_MODULES_PATHS//[[:space:]]/}" ]] ; then
                  rm -rf ${NODE_MODULES_PATHS}
                fi
                yarn install --immutable
              elif (YARN_ENABLE_SCRIPTS=false yarn install --immutable) ; then
                # Exact-hit caches are only saved after a fully-scripted install, so
                # dependency lifecycle scripts (allow-scripts) have already run in this
                # tree — verify without running scripts (Yarn 4 has no script-free
                # "yarn check --integrity" probe) and run only the repo's own
                # postinstall steps.
                # skip_plugin_build additionally skips the ~60s plugin-build pass; only
                # safe for jobs whose own nx run materialises all needed outputs anyway
                # (plugin-build also side-effect-builds plugin deps like package dist/types,
                # which e.g. type-aware lint relies on).
                # `env` is required: an assignment produced by variable expansion is not
                # parsed as an assignment prefix by the shell.
                env ALLOW_SCRIPTS_RUNNING=1 ${SKIP_PLUGIN_BUILD_ENV} yarn postinstall
              else
                # The exact-hit cache turned out stale/corrupt: reinstall fully-scripted.
                # yarn install --immutable both verifies and fixes in one step, and is a
                # ~12ms no-op when nothing needs to change, so no separate check is needed.
                yarn install --immutable
              fi

        - name: yarn install (skipping postinstall)
          if: inputs.cache_mode == 'rw' && inputs.yarn_postinstall == 'false'
          id: yarn_install_fast
          shell: bash
          run: |
              YARN_ENABLE_SCRIPTS=false yarn install --immutable

        - name: yarn install (skipping postinstall)
          # Covers both cache modes deliberately. The previous `cache_mode == 'rw'` guard left
          # `ro` consumers with no install and no integrity check at all, so an inexact
          # restore-keys fallback was built against silently: a tree predating the current
          # lockfile resolves as a missing module at bundle time rather than a cache error.
          if: inputs.yarn_postinstall == 'no-install'
          id: yarn_install_check
          shell: bash
          env:
              # 'true' only on an exact key hit; an inexact restore-keys fallback can carry a
              # node_modules tree that predates this lockfile.
              EXACT_CACHE_HIT: ${{ steps.cache_rw.outputs.cache-hit == 'true' || steps.cache_ro.outputs.cache-hit == 'true' }}
          run: |
              if [[ "${EXACT_CACHE_HIT}" == "true" ]] ; then
                yarn install --immutable
              else
                # Fallback restore: reconcile the tree against this lockfile before any build
                # reads it. Installing under cache_mode:ro is safe — nothing is saved.
                yarn install --immutable
              fi

        - name: Adopt restored Nx cache DB
          # Nx names its cache DB after the machine ID, which runners don't share predictably.
          if: inputs.cache_mode != 'off' && inputs.nx_restore != 'false'
          shell: bash
          run: node "${{ github.action_path }}/nx-cache-db.mjs" adopt "${RUNNER_TEMP}/nx-cache-state.json"

        - name: Merge base-branch Nx cache
          if: steps.nx_scope.outputs.separate == 'true' && inputs.nx_cache_merge_base != 'false'
          shell: bash
          run: node "${{ github.action_path }}/nx-cache-db.mjs" merge "${RUNNER_TEMP}/nx-cache-state.json" "${RUNNER_TEMP}/nx-base"

        - name: Save node_modules
          # Explicit save of the freshly installed tree (see "Restore node_modules" for
          # why the post-save hook cannot be used). Skipped on an exact restore — the
          # cache already exists under this key.
          if: inputs.cache_mode == 'rw' && steps.cache_rw.outputs.cache-hit != 'true'
          uses: actions/cache/save@v6
          with:
              path: ${{ inputs.node_modules_paths }}
              key: node_modules-${{ runner.os }}-${{ steps.nx_config.outputs.release_branch && format('release-{0}-{1}', steps.nx_config.outputs.release_branch, inputs.node_modules_hash) || inputs.node_modules_hash }}

        - name: Hollow yarn cache
          # Shrink the download cache before saving it (~2.5 GB -> ~0.2 GB compressed).
          # yarn v1 fetches every platform's optional native binaries and only checks
          # os/cpu afterwards, so most of the cache is packages this runner never links.
          # See hollow-yarn-cache.sh for why they are hollowed rather than deleted.
          # Gated identically to "Save yarn cache".
          if: inputs.cache_mode == 'rw' && steps.cache_rw.outputs.cache-hit != 'true' && steps.yarn_cache.outputs.cache-hit != 'true' && inputs.save_yarn_cache != 'false'
          shell: bash
          env:
              YARN_CACHE_DIR: ${{ steps.yarn_cache_dir.outputs.dir }}
          run: bash "${{ github.action_path }}/hollow-yarn-cache.sh" "${YARN_CACHE_DIR}"

        - name: Save yarn cache
          # Save the download cache warmed by yarn install (see "Restore yarn cache").
          # rw writers (e.g. the init job) warm it; ro readers (matrix jobs) only restore.
          # Warmed on the default branch (latest), whose caches GitHub makes readable by all
          # branches, so a single warm propagates.
          #
          # Gated to mirror the restore: only when a real install ran (node_modules was not an
          # exact hit, so the install step reconciled it) and the yarn cache itself was not an
          # exact hit (nothing new to save otherwise). Without this, an exact-node_modules-hit
          # job would skip the restore yet still attempt a save of an unpopulated/stale cache
          # dir.
          if: inputs.cache_mode == 'rw' && steps.cache_rw.outputs.cache-hit != 'true' && steps.yarn_cache.outputs.cache-hit != 'true' && inputs.save_yarn_cache != 'false'
          uses: actions/cache/save@v6
          with:
              path: ${{ steps.yarn_cache_dir.outputs.dir }}
              key: yarn-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node_modules_hash }}
